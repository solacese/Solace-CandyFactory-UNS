[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "haribot-agents"
version = "0.1.0"
description = "Haribot SAM agents for sweet packing demo"
requires-python = ">=3.10"
dependencies = [
  "solace-agent-mesh",
  "python-dotenv",
  "requests",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
